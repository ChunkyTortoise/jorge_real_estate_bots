name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy to Render
    runs-on: ubuntu-latest
    needs: []  # runs independently — CI is a separate workflow

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: chunktort
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            docker.io/chunktort/jorge-realty-ai:sha-${{ github.sha }}
            docker.io/chunktort/jorge-realty-ai:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Render image & deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-d6d5go15pdvs73fcjjq0
          IMAGE: docker.io/chunktort/jorge-realty-ai:sha-${{ github.sha }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          GHL_CALENDAR_ID: ${{ secrets.GHL_CALENDAR_ID }}
          JORGE_USER_ID: ${{ secrets.JORGE_USER_ID }}
          JORGE_CALENDAR_ID: ${{ secrets.JORGE_CALENDAR_ID }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          # Update the image URL (note: this may reset env vars, so we re-set them below)
          curl -sf -X PATCH \
            "https://api.render.com/v1/services/${SERVICE_ID}" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"image\": {\"ownerId\": \"chunktort\", \"registryCredentialId\": null, \"imagePath\": \"${IMAGE}\"}}"

          # Re-set all required env vars (PATCH above may reset them)
          curl -sf -X PUT \
            "https://api.render.com/v1/services/${SERVICE_ID}/env-vars" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "[
              {\"key\": \"ANTHROPIC_API_KEY\", \"value\": \"${ANTHROPIC_API_KEY}\"},
              {\"key\": \"GHL_API_KEY\", \"value\": \"${GHL_API_KEY}\"},
              {\"key\": \"GHL_LOCATION_ID\", \"value\": \"${GHL_LOCATION_ID}\"},
              {\"key\": \"GHL_CALENDAR_ID\", \"value\": \"${GHL_CALENDAR_ID}\"},
              {\"key\": \"GHL_ALLOW_UNSIGNED_WEBHOOKS\", \"value\": \"true\"},
              {\"key\": \"JORGE_USER_ID\", \"value\": \"${JORGE_USER_ID}\"},
              {\"key\": \"JORGE_CALENDAR_ID\", \"value\": \"${JORGE_CALENDAR_ID}\"},
              {\"key\": \"JORGE_SELLER_MODE\", \"value\": \"true\"},
              {\"key\": \"JWT_SECRET\", \"value\": \"${JWT_SECRET}\"},
              {\"key\": \"REDIS_URL\", \"value\": \"${REDIS_URL}\"},
              {\"key\": \"ENVIRONMENT\", \"value\": \"production\"},
              {\"key\": \"ADMIN_API_KEY\", \"value\": \"${ADMIN_API_KEY}\"},
              {\"key\": \"DATABASE_URL\", \"value\": \"${DATABASE_URL}\"},
              {\"key\": \"ADMIN_PASSWORD\", \"value\": \"${ADMIN_PASSWORD}\"},
              {\"key\": \"JORGE_BUYER_MODE\", \"value\": \"true\"}
            ]"

          # Trigger a deploy
          curl -sf -X POST \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"clearCache\": \"do_not_clear\"}"

      - name: Post-deploy health check
        run: |
          echo "Waiting 90s for service to boot..."
          sleep 90
          curl -sf "https://jorge-realty-ai-xxdf.onrender.com/health/aggregate" || exit 1
