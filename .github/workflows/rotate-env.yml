name: Rotate Render Env Vars (one-shot — delete after run)

on:
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE_ID: srv-d6d5go15pdvs73fcjjq0
    steps:
      - name: Update ADMIN_API_KEY and LOG_FORMAT on Render
        run: |
          # Render API: PUT /v1/services/{id}/env-vars (replaces all env vars)
          # Use PATCH approach: get current vars, merge, then PUT
          CURRENT=$(curl -sf \
            "https://api.render.com/v1/services/${SERVICE_ID}/env-vars" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json")
          echo "Current env var count: $(echo $CURRENT | python3 -c 'import json,sys; d=json.load(sys.stdin); print(len(d))')"

          # Build updated env var array: preserve all existing, override ADMIN_API_KEY, add LOG_FORMAT
          UPDATED=$(echo $CURRENT | python3 -c "
import json, sys
data = json.load(sys.stdin)
# data is a list of {envVar: {key, value}}
updated = []
seen = set()
for item in data:
    k = item['envVar']['key']
    v = item['envVar']['value']
    if k == 'ADMIN_API_KEY':
        v = '${{ secrets.ADMIN_API_KEY }}'
    if k == 'LOG_FORMAT':
        seen.add('LOG_FORMAT')
    updated.append({'key': k, 'value': v})
    seen.add(k)
if 'LOG_FORMAT' not in seen:
    updated.append({'key': 'LOG_FORMAT', 'value': 'json'})
print(json.dumps(updated))
")

          curl -sf -X PUT \
            "https://api.render.com/v1/services/${SERVICE_ID}/env-vars" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$UPDATED"
          echo "Env vars updated."

      - name: Trigger redeploy to pick up new env vars
        run: |
          curl -sf -X POST \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}'
          echo "Deploy triggered."

      - name: Wait and verify health
        run: |
          echo "Waiting 120s for new deploy..."
          sleep 120
          curl -sf "https://jorge-realty-ai-xxdf.onrender.com/health/aggregate"
