version: "3.8"

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    command: uvicorn bots.lead_bot.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GHL_API_KEY=${GHL_API_KEY:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GHL_LOCATION_ID=${GHL_LOCATION_ID:-}
      - GHL_WEBHOOK_SECRET=${GHL_WEBHOOK_SECRET:-}
      - JORGE_USER_ID=${JORGE_USER_ID:-}
      - JORGE_CALENDAR_ID=${JORGE_CALENDAR_ID:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    command: streamlit run command_center/dashboard_v3.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      app:
        condition: service_healthy
